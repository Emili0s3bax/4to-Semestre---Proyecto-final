<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest-UIDE</title>
    <link rel="icon" href="/imagenes/pinterest-badge-logo-png_seeklogo-157893.png" type="image/png">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <nav class="sidebar">
        <div class="logo-container">
            <img src="imagenes/pinterest-badge-logo-png_seeklogo-157893.png" alt="Pinterest Logo" class="logo-img">
        </div>
        
        <div class="nav-icons">
            <img src="/imagenes/images.png" class="icon" alt="Inicio">
            <img src="/imagenes/images2.png" class="icon" alt="Explorar">
            <img src="/imagenes/collage.png" class="icon" alt="Tableros">
            <img src="/imagenes/filled-plus-2-math.png" class="icon" alt="Crear">
            <img src="/imagenes/552872.png" class="icon" alt="Notificaciones">
            <img src="/imagenes/151801.png" class="icon" alt="Mensajes">
        </div>

        <div class="settings-container">
            <img src="/imagenes/657089.png" class="icon" alt="Ajustes">
        </div>
    </nav>

    <div class="main-wrapper">
        <header>
            <div class="search-container">
                <img src="/imagenes/search.png" class="search-icon" alt="search">
                <input type="text" placeholder="Buscar">
                <img src="/imagenes/camera.png" class="camera-icon" alt="camera">
            </div>
            
            <div class="profile-icon">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#333"><circle cx="12" cy="12" r="10"/></svg>
            </div>
        </header>

        <main id="pinterest-container" class="masonry-grid">
            </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
