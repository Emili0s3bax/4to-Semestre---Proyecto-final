<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publify | Inspiración visual</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/index.css">
    <style>
        /* Estilos adicionales de autenticación */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-btn {
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .login-btn-header {
            background: transparent;
            color: #111;
        }

        .login-btn-header:hover {
            background: #efefef;
        }

        .register-btn-header {
            background: #e60023;
            color: white;
        }

        .register-btn-header:hover {
            background: #ad081b;
        }

        .user-menu {
            position: relative;
        }

        .profile-icon {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 40px;
            transition: background 0.2s;
        }

        .profile-icon:hover {
            background: #efefef;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .user-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            min-width: 220px;
            z-index: 1000;
            display: none;
            overflow: hidden;
        }

        .dropdown-header {
            padding: 12px 16px;
        }

        .dropdown-header strong {
            display: block;
            font-size: 14px;
        }

        .dropdown-header span {
            font-size: 12px;
            color: #767676;
        }

        .dropdown-divider {
            height: 1px;
            background: #e2e2e2;
            margin: 4px 0;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: #111;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
        }

        .dropdown-item:hover {
            background: #f5f5f5;
        }

        .logout-btn {
            color: #e60023;
        }

        .logout-btn i {
            color: #e60023;
        }

        /* Overlay y estilos de tarjetas */
        .post-image-wrapper {
            position: relative;
            cursor: pointer;
        }

        .post-overlay {
            position: absolute;
            top: 12px;
            right: 12px;
            left: 12px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .post-card:hover .post-overlay {
            opacity: 1;
        }

        .save-pin-btn, .like-pin-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background: white;
        }

        .save-pin-btn {
            background: #e60023;
            color: white;
        }

        .save-pin-btn.saved {
            background: #111;
        }

        .like-pin-btn.liked {
            background: #e60023;
            color: white;
        }

        .post-info {
            padding: 12px 14px;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .post-author img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .post-author span {
            font-size: 12px;
            color: #767676;
        }

        .post-title {
            font-size: 14px;
            font-weight: 500;
        }

        .loader {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e2e2;
            border-top-color: #e60023;
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .categories-bar {
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            overflow-x: auto;
            border-bottom: 1px solid #e2e2e2;
            background: white;
            position: sticky;
            top: 73px;
            z-index: 98;
        }

        .category-btn {
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            background: #efefef;
            font-size: 14px;
            cursor: pointer;
        }

        .category-btn.active {
            background: #111;
            color: white;
        }

        .menu-toggle {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #efefef;
            cursor: pointer;
            font-size: 18px;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                left: -240px;
                transition: left 0.3s;
                z-index: 1000;
                background: white;
                height: 100vh;
            }
            .sidebar.mobile-open {
                left: 0;
            }
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .main-wrapper {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <nav class="sidebar">
        <div class="logo-container">
            <i class="fab fa-pinterest"></i>
            <span class="logo-text">Publify</span>
        </div>
        
        <div class="nav-icons">
            <div class="nav-item active"><i class="fas fa-home"></i><span>Inicio</span></div>
            <div class="nav-item"><i class="fas fa-compass"></i><span>Explorar</span></div>
            <div class="nav-item"><i class="fas fa-plus-circle"></i><span>Crear</span></div>
            <div class="nav-item"><i class="fas fa-bell"></i><span>Notificaciones</span></div>
            <div class="nav-item"><i class="fas fa-envelope"></i><span>Mensajes</span></div>
        </div>

        <div class="settings-container">
            <div class="nav-item"><i class="fas fa-cog"></i><span>Ajustes</span></div>
        </div>
    </nav>

    <div class="main-wrapper">
        <header>
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="main-search" placeholder="Buscar">
                <i class="fas fa-camera"></i>
            </div>
            
            <!-- SECCIÓN DE USUARIO -->
            <div class="header-actions" id="headerActions">
                <!-- Se carga dinámicamente -->
            </div>
        </header>

        <!-- Barra de categorías -->
        <div class="categories-bar">
            <button class="category-btn active" data-categoria="todos">Para ti</button>
            <button class="category-btn" data-categoria="Arte">Arte</button>
            <button class="category-btn" data-categoria="Naturaleza">Naturaleza</button>
            <button class="category-btn" data-categoria="Paisajes">Paisajes</button>
            <button class="category-btn" data-categoria="Animales">Animales</button>
            <button class="category-btn" data-categoria="Viajes">Viajes</button>
        </div>

        <main id="pinterest-container" class="masonry-grid"></main>

        <div class="loader" id="loader" style="display: none;">
            <div class="spinner"></div>
            <p>Cargando más ideas...</p>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            let allPosts = [];
            let displayedPosts = [];
            let currentCategory = 'todos';
            let isLoading = false;
            let currentPage = 0;
            const POSTS_PER_PAGE = 12;

            // ========== GESTIÓN DE USUARIO ==========
            function updateUserUI() {
                const token = localStorage.getItem('token');
                const user = JSON.parse(localStorage.getItem('user') || 'null');
                const headerActions = $('#headerActions');
                
                if (token && user) {
                    headerActions.html(`
                        <div class="user-menu">
                            <div class="profile-icon" id="userMenuBtn">
                                <div class="user-avatar" style="background-color: ${user.avatar_color || '#e60023'}">
                                    ${user.nombre ? user.nombre.charAt(0).toUpperCase() : 'U'}
                                </div>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                            <div class="user-dropdown" id="userDropdown">
                                <div class="dropdown-header">
                                    <strong>${user.nombre || user.username}</strong>
                                    <span>@${user.username}</span>
                                </div>
                                <div class="dropdown-divider"></div>
                                <a href="profile.html" class="dropdown-item">
                                    <i class="fas fa-user"></i> Mi perfil
                                </a>
                                <div class="dropdown-divider"></div>
                                <button id="logoutBtn" class="dropdown-item logout-btn">
                                    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                                </button>
                            </div>
                        </div>
                    `);
                    
                    $('#userMenuBtn').on('click', function(e) {
                        e.stopPropagation();
                        $('#userDropdown').toggle();
                    });
                    
                    $(document).on('click', function() {
                        $('#userDropdown').hide();
                    });
                    
                    $('#logoutBtn').on('click', function() {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        updateUserUI();
                        location.reload();
                    });
                } else {
                    headerActions.html(`
                        <a href="login.html" class="auth-btn login-btn-header">Iniciar sesión</a>
                        <a href="register.html" class="auth-btn register-btn-header">Registrarse</a>
                    `);
                }
            }

            function verifyToken() {
                const token = localStorage.getItem('token');
                if (token) {
                    $.ajax({
                        url: 'http://localhost:8000/api/auth/verify',
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${token}` },
                        error: function() {
                            localStorage.removeItem('token');
                            localStorage.removeItem('user');
                            updateUserUI();
                        }
                    });
                }
            }

            // ========== OBTENER POSTS DE LA API ==========
            async function fetchPosts() {
                try {
                    const response = await fetch('http://localhost:8000/posts');
                    allPosts = await response.json();
                    
                    allPosts = allPosts.map(post => ({
                        ...post,
                        autor_nombre: post.autor_nombre || "Usuario Anónimo",
                        categoria: post.categoria || "Inspiración",
                        likes: Math.floor(Math.random() * 500) + 10
                    }));
                    
                    filterAndDisplayPosts();
                } catch (error) {
                    console.error('Error:', error);
                    allPosts = [
                        { id: 1, url: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600", titulo: "Inspiración Creativa", categoria: "Arte", autor_nombre: "Artista", likes: 234 },
                        { id: 2, url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600", titulo: "Montañas Mágicas", categoria: "Paisajes", autor_nombre: "Viajero", likes: 567 },
                        { id: 3, url: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600", titulo: "Valle Escondido", categoria: "Naturaleza", autor_nombre: "Explorador", likes: 892 },
                        { id: 4, url: "https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=600", titulo: "Zorro Curioso", categoria: "Animales", autor_nombre: "Wildlife", likes: 445 },
                        { id: 5, url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600", titulo: "Playa Caribeña", categoria: "Viajes", autor_nombre: "Tropical", likes: 1234 }
                    ];
                    filterAndDisplayPosts();
                }
            }

            // ========== FILTRAR POSTS ==========
            function filterAndDisplayPosts() {
                let filtered = [...allPosts];
                
                if (currentCategory !== 'todos') {
                    filtered = filtered.filter(post => post.categoria === currentCategory);
                }
                
                const searchTerm = $('#main-search').val().toLowerCase();
                if (searchTerm) {
                    filtered = filtered.filter(post => 
                        post.titulo.toLowerCase().includes(searchTerm) ||
                        post.autor_nombre.toLowerCase().includes(searchTerm)
                    );
                }
                
                displayedPosts = filtered;
                currentPage = 0;
                $('#pinterest-container').empty();
                loadMorePosts();
            }

            // ========== CARGAR MÁS POSTS ==========
            function loadMorePosts() {
                if (isLoading) return;
                isLoading = true;
                $('#loader').show();
                
                setTimeout(() => {
                    const start = currentPage * POSTS_PER_PAGE;
                    const end = start + POSTS_PER_PAGE;
                    const postsToLoad = displayedPosts.slice(start, end);
                    
                    postsToLoad.forEach(post => renderPostCard(post));
                    
                    currentPage++;
                    isLoading = false;
                    $('#loader').hide();
                }, 200);
            }

            // ========== RENDERIZAR TARJETA ==========
            function renderPostCard(post) {
                const card = $('<div>').addClass('post-card');
                
                const isSaved = localStorage.getItem(`saved_${post.id}`) === 'true';
                
                let likesCount = post.likes;
                let isLiked = false;
                const savedLikes = localStorage.getItem(`likes_${post.id}`);
                if (savedLikes) {
                    const data = JSON.parse(savedLikes);
                    likesCount = data.count;
                    isLiked = data.liked;
                }
                
                const cardHtml = `
                    <div class="post-image-wrapper">
                        <img src="${post.url}" alt="${post.titulo}" class="pin-img-click" loading="lazy">
                        <div class="post-overlay">
                            <button class="save-pin-btn ${isSaved ? 'saved' : ''}" data-id="${post.id}">
                                <i class="${isSaved ? 'fas fa-check' : 'fas fa-save'}"></i>
                                <span>${isSaved ? 'Guardado' : 'Guardar'}</span>
                            </button>
                            <button class="like-pin-btn ${isLiked ? 'liked' : ''}" data-id="${post.id}">
                                <i class="${isLiked ? 'fas fa-heart' : 'far fa-heart'}"></i>
                                <span class="likes-count">${likesCount.toLocaleString()}</span>
                            </button>
                        </div>
                    </div>
                    <div class="post-info">
                        <div class="post-author">
                            <img src="https://i.pravatar.cc/100?img=${post.autor_nombre.length}" alt="${post.autor_nombre}">
                            <span>${escapeHtml(post.autor_nombre)}</span>
                        </div>
                        <p class="post-title">${escapeHtml(post.titulo)}</p>
                    </div>
                `;
                
                card.html(cardHtml);
                
                // Redirección a detalle
                card.find('.pin-img-click').on('click', function(e) {
                    e.stopPropagation();
                    window.location.href = `detalle.html?image=${encodeURIComponent(post.url)}`;
                });
                
                card.find('.post-title, .post-author').on('click', function(e) {
                    e.stopPropagation();
                    window.location.href = `detalle.html?image=${encodeURIComponent(post.url)}`;
                });
                
                // Guardar pin
                card.find('.save-pin-btn').on('click', function(e) {
                    e.stopPropagation();
                    const btn = $(this);
                    const postId = btn.data('id');
                    const isCurrentlySaved = localStorage.getItem(`saved_${postId}`) === 'true';
                    
                    if (isCurrentlySaved) {
                        localStorage.removeItem(`saved_${postId}`);
                        btn.removeClass('saved');
                        btn.html('<i class="fas fa-save"></i><span>Guardar</span>');
                    } else {
                        localStorage.setItem(`saved_${postId}`, 'true');
                        btn.addClass('saved');
                        btn.html('<i class="fas fa-check"></i><span>Guardado</span>');
                    }
                });
                
                // Like
                card.find('.like-pin-btn').on('click', function(e) {
                    e.stopPropagation();
                    const btn = $(this);
                    const postId = btn.data('id');
                    const likesKey = `likes_${postId}`;
                    const savedLikes = localStorage.getItem(likesKey);
                    let currentLikes, currentLiked;
                    
                    if (savedLikes) {
                        const data = JSON.parse(savedLikes);
                        currentLikes = data.count;
                        currentLiked = data.liked;
                    } else {
                        currentLikes = post.likes;
                        currentLiked = false;
                    }
                    
                    if (currentLiked) {
                        currentLikes--;
                        currentLiked = false;
                        btn.removeClass('liked');
                        btn.find('i').removeClass('fas').addClass('far');
                    } else {
                        currentLikes++;
                        currentLiked = true;
                        btn.addClass('liked');
                        btn.find('i').removeClass('far').addClass('fas');
                    }
                    
                    localStorage.setItem(likesKey, JSON.stringify({ count: currentLikes, liked: currentLiked }));
                    btn.find('.likes-count').text(currentLikes.toLocaleString());
                });
                
                $('#pinterest-container').append(card);
            }

            // ========== UTILIDADES ==========
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ========== EVENTOS ==========
            $('#main-search').on('input', function() {
                filterAndDisplayPosts();
            });
            
            $('.category-btn').on('click', function() {
                $('.category-btn').removeClass('active');
                $(this).addClass('active');
                currentCategory = $(this).data('categoria');
                filterAndDisplayPosts();
            });
            
            $(window).on('scroll', function() {
                if ($(window).scrollTop() + $(window).height() > $(document).height() - 300) {
                    if (!isLoading && displayedPosts.length > currentPage * POSTS_PER_PAGE) {
                        loadMorePosts();
                    }
                }
            });
            
            $('#menuToggle').on('click', function() {
                $('.sidebar').toggleClass('mobile-open');
            });

            // ========== INICIALIZAR ==========
            updateUserUI();
            verifyToken();
            fetchPosts();
        });
    </script>

</body>
</html>
