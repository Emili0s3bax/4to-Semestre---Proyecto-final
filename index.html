<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publify</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="icon" href="/4to-Semestre---Proyecto-final/imagenes/pinterest-badge-logo-png_seeklogo-157893.png" type="image/png">
    <link rel="stylesheet" href="/4to-Semestre---Proyecto-final/css/index.css">
</head>
<body>

    <nav class="sidebar">
        <div class="logo-container">
            <img src="/4to-Semestre---Proyecto-final/imagenes/pinterest-badge-logo-png_seeklogo-157893.png" alt="Pinterest Logo" class="logo-img">
        </div>
        
        <div class="nav-icons">
            <img src="/4to-Semestre---Proyecto-final/imagenes/images.png" class="icon" alt="Inicio">
            <img src="/4to-Semestre---Proyecto-final/imagenes/images2.png" class="icon" alt="Explorar">
            <img src="/4to-Semestre---Proyecto-final/imagenes/collage.png" class="icon" alt="Tableros">
            <img src="/4to-Semestre---Proyecto-final/imagenes/filled-plus-2-math.png" class="icon" alt="Crear">
            <img src="/4to-Semestre---Proyecto-final/imagenes/552872.png" class="icon" alt="Notificaciones">
            <img src="/4to-Semestre---Proyecto-final/imagenes/151801.png" class="icon" alt="Mensajes">
        </div>

        <div class="settings-container">
            <img src="/4to-Semestre---Proyecto-final/imagenes/657089.png" class="icon" alt="Ajustes">
        </div>
    </nav>

    <div class="main-wrapper">
        <header>
            <div class="search-container">
                <img src="/4to-Semestre---Proyecto-final/imagenes/search.png" class="search-icon" alt="search">
                <input type="text" id="main-search" placeholder="Buscar">
                <img src="/4to-Semestre---Proyecto-final/imagenes/camera.png" class="camera-icon" alt="camera">
            </div>
            <div class="profile-icon">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#333"><circle cx="12" cy="12" r="10"/></svg>
            </div>
        </header>

        <main id="pinterest-container" class="masonry-grid"></main>
    </div>

    <script>
        $(document).ready(function() {
            // Efecto jQuery para el buscador
            $('#main-search').on('focus', function() {
                $('.search-container').css('background-color', '#e0e0e0');
            }).on('blur', function() {
                $('.search-container').css('background-color', '#efefef');
            });

            // Ejemplo de carga de elementos (puedes expandir esto)
            console.log("jQuery inicializado correctamente");
        });
    </script>
</body>
</html>
