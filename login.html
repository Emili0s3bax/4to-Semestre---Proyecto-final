<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <!-- Incluir jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .error-message {
            background-color: #ffeef0;
            color: #e60023;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
            border: 1px solid #ffd2d6;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <a href="index.html" style="text-decoration: none;"><div class="auth-logo">P</div></a>
            <h1>Te damos la bienvenida</h1>
            <p>Encuentra nuevas ideas para tus maquetados</p>
            
            <div id="error-alert" class="error-message"></div>

            <form class="auth-form" id="login-form">
                <input type="text" id="identifier" placeholder="Correo electrónico o usuario" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit" class="btn-auth-submit">Iniciar Sesión</button>
            </form>
            <div class="auth-switch">¿No tienes cuenta? <a href="register.html">Regístrate</a></div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Si ya está logueado, redirigir al index
            if (localStorage.getItem("currentUser")) {
                window.location.href = "index.html";
            }

            $("#login-form").on("submit", function(e) {
                e.preventDefault();
                
                const identifier = $("#identifier").val().trim();
                const password = $("#password").val();
                const $errorAlert = $("#error-alert");

                $errorAlert.hide().text("");

                if (!identifier || !password) {
                    $errorAlert.text("Por favor, completa todos los campos.").fadeIn();
                    return;
                }

                // Deshabilitar botón de enviar para feedback
                const $submitBtn = $(this).find("button[type='submit']");
                $submitBtn.prop("disabled", true).text("Iniciando sesión...");

                $.ajax({
                    url: "http://127.0.0.1:8000/api/auth/login",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({
                        identifier: identifier,
                        password: password
                    }),
                    success: function(response) {
                        // Guardar datos del usuario
                        localStorage.setItem("currentUser", JSON.stringify(response));
                        window.location.href = "index.html";
                    },
                    error: function(xhr) {
                        $submitBtn.prop("disabled", false).text("Iniciar Sesión");
                        let errorMsg = "Ocurrió un error al iniciar sesión.";
                        if (xhr.responseJSON && xhr.responseJSON.detail) {
                            errorMsg = xhr.responseJSON.detail;
                        }
                        $errorAlert.text(errorMsg).fadeIn();
                    }
                });
            });
        });
    </script>
</body>
</html>
