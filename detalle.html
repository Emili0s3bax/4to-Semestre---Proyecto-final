<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Pin | Publify</title>
    <link rel="stylesheet" href="/css/detalle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="/css/settings-panel.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
    <script src="settings-panel.js"></script>
</head>

<body>

    <!-- HEADER CON AUTENTICACIÓN -->
    <header class="detail-header">
        <div class="header-left">
            <button class="back-button" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>
        <div class="header-actions" id="headerActions">
            <!-- Se carga dinámicamente -->
        </div>
    </header>

    <div class="pin-detail-container">
        <div class="pin-detail-card">
            
            <!-- Columna izquierda: Imagen -->
            <div class="pin-detail-image">
                <img id="main-image" src="" alt="Pin">
                <div class="image-overlay">
                    <button class="overlay-btn expand-btn" id="expandBtn">
                        <i class="fas fa-expand"></i>
                    </button>
                    <button class="overlay-btn like-btn" id="likeBtn">
                        <i class="far fa-heart"></i>
                    </button>
                    <button class="overlay-btn share-btn">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
                <div class="likes-count" id="likesCount">
                    <i class="fas fa-heart"></i>
                    <span id="likesNumber">0</span>
                </div>
            </div>

            <!-- Columna derecha: Información -->
            <div class="pin-detail-info">
                
                <div class="pin-detail-actions">
                    <button class="btn-icon"><i class="fas fa-share-alt"></i></button>
                    <button class="btn-icon"><i class="fas fa-ellipsis-h"></i></button>
                    <button class="btn-save" id="savePinBtn"><i class="fas fa-save"></i> Guardar</button>
                </div>

                <div class="pin-author">
                    <img id="author-avatar" src="">
                    <div class="author-info">
                        <strong id="author-name"></strong>
                        <span id="author-followers"></span>
                        <button class="follow-btn" id="followBtn">Seguir</button>
                    </div>
                </div>

                <h2 id="pin-title"></h2>
                <p id="pin-description" class="pin-description"></p>

                <div class="comments-section">
                    <div class="comments-header">
                        <h3 id="comments-count">0 comentarios</h3>
                    </div>

                    <div id="comments-list">
                        <!-- Comentarios dinámicos -->
                    </div>

                    <div class="comment-input-container">
                        <div class="comment-avatar-mini" id="currentUserAvatar"></div>
                        <input type="text" id="comment-input" placeholder="Añade un comentario...">
                        <button id="submitCommentBtn" class="submit-comment-btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Sección de más ideas -->
    <div class="more-ideas">
        <h3>Más ideas para ti</h3>
        <div class="related-pins-grid" id="relatedPinsGrid"></div>
    </div>

    <!-- Modal para ampliar imagen -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <img id="modalImage" src="">
        </div>
    </div>

    <script>
        $(document).ready(function () {
            const params = new URLSearchParams(window.location.search);
            const imageUrl = params.get('image');
            let currentPost = null;
            let allPosts = [];
            let allUsers = [];
            let isLiked = false;
            let likesCount = 0;
            let currentUser = null;

            // ========== GESTIÓN DE USUARIO ==========
            function updateUserUI() {
                const token = localStorage.getItem('token');
                const user = JSON.parse(localStorage.getItem('user') || 'null');
                const headerActions = $('#headerActions');
                
                if (token && user) {
                    currentUser = user;
                    headerActions.html(`
                        <div class="user-menu">
                            <div class="profile-icon" id="userMenuBtn">
                                <div class="user-avatar" style="background-color: ${user.avatar_color || '#7B2D8E'}">
                                    ${user.nombre ? user.nombre.charAt(0).toUpperCase() : 'U'}
                                </div>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                            <div class="user-dropdown" id="userDropdown">
                                <div class="dropdown-header">
                                    <strong>${escapeHtml(user.nombre || user.username)}</strong>
                                    <span>@${escapeHtml(user.username)}</span>
                                </div>
                                <div class="dropdown-divider"></div>
                                <a href="profile.html" class="dropdown-item">
                                    <i class="fas fa-user"></i> Mi perfil
                                </a>
                                <div class="dropdown-divider"></div>
                                <button id="logoutBtn" class="dropdown-item logout-btn">
                                    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                                </button>
                            </div>
                        </div>
                    `);
                    
                    $('#currentUserAvatar').html(`
                        <div class="user-avatar" style="background-color: ${user.avatar_color || '#7B2D8E'}; width: 32px; height: 32px; font-size: 14px;">
                            ${user.nombre ? user.nombre.charAt(0).toUpperCase() : 'U'}
                        </div>
                    `);
                    
                    $('#userMenuBtn').on('click', function(e) {
                        e.stopPropagation();
                        $('#userDropdown').toggle();
                    });
                    
                    $(document).on('click', function() {
                        $('#userDropdown').hide();
                    });
                    
                    $('#logoutBtn').on('click', function() {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.href = 'index.html';
                    });
                } else {
                    headerActions.html(`
                        <a href="login.html" class="auth-btn login-btn-header">Iniciar sesión</a>
                        <a href="register.html" class="auth-btn register-btn-header">Registrarse</a>
                    `);
                    $('#currentUserAvatar').html(`
                        <div class="user-avatar" style="background-color: #ccc; width: 32px; height: 32px; font-size: 14px;">
                            ?
                        </div>
                    `);
                }
            }

            function verifyToken() {
                const token = localStorage.getItem('token');
                if (token) {
                    $.ajax({
                        url: 'http://localhost:8000/api/auth/verify',
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${token}` },
                        error: function() {
                            localStorage.removeItem('token');
                            localStorage.removeItem('user');
                            updateUserUI();
                        }
                    });
                }
            }

            // ========== FUNCIONES DE SEGUIDORES ==========
            function getFollowingKey() {
                return `following_${currentUser?.id}`;
            }

            function loadFollowing() {
                if (!currentUser) return [];
                const key = getFollowingKey();
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : [];
            }

            function saveFollowing(following) {
                if (!currentUser) return;
                const key = getFollowingKey();
                localStorage.setItem(key, JSON.stringify(following));
            }

            function isFollowing(authorId) {
                if (!currentUser || !authorId) return false;
                const following = loadFollowing();
                return following.some(f => f.id === authorId);
            }

            function followUser(userToFollow) {
                if (!currentUser) return false;
                const following = loadFollowing();
                if (!following.some(f => f.id === userToFollow.id)) {
                    following.push({
                        id: userToFollow.id,
                        nombre: userToFollow.nombre || userToFollow.autor_nombre,
                        username: userToFollow.username || (userToFollow.autor_nombre || '').toLowerCase().replace(/\s/g, ''),
                        avatar_color: userToFollow.avatar_color || '#7B2D8E'
                    });
                    saveFollowing(following);
                    return true;
                }
                return false;
            }

            function unfollowUser(userId) {
                if (!currentUser) return false;
                let following = loadFollowing();
                following = following.filter(f => f.id !== userId);
                saveFollowing(following);
                return true;
            }

            function updateFollowButton() {
                if (!currentUser) {
                    $('#followBtn').text('Seguir').css('background', '#7B2D8E').css('color', 'white');
                    return;
                }
                
                const authorId = currentPost?.autor_id;
                if (authorId && isFollowing(authorId)) {
                    $('#followBtn').text('Siguiendo').css('background', '#efefef').css('color', '#111');
                } else {
                    $('#followBtn').text('Seguir').css('background', '#7B2D8E').css('color', 'white');
                }
            }

            // ========== FUNCIONES DE LA API ==========
            async function fetchAllPosts() {
                try {
                    const response = await fetch('http://localhost:8000/posts');
                    allPosts = await response.json();
                    return allPosts;
                } catch (error) {
                    console.error('Error cargando posts:', error);
                    allPosts = [
                        { id: 1, url: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600", titulo: "Inspiración Creativa", categoria: "Arte", autor_nombre: "Artista Digital", autor_id: 1, descripcion: "Una obra llena de creatividad" },
                        { id: 2, url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600", titulo: "Montañas Mágicas", categoria: "Paisajes", autor_nombre: "Viajero", autor_id: 2, descripcion: "Hermosos paisajes naturales" }
                    ];
                    return allPosts;
                }
            }

            async function fetchAllUsers() {
                try {
                    const response = await fetch('http://localhost:8000/users');
                    allUsers = await response.json();
                    return allUsers;
                } catch (error) {
                    console.error('Error cargando usuarios:', error);
                    allUsers = [];
                    return allUsers;
                }
            }

            function getCurrentPost() {
                if (!imageUrl) return null;
                return allPosts.find(post => post.url === imageUrl);
            }

            function getRelatedPosts(currentPost, limit = 8) {
                if (!currentPost) return [];
                const sameCategory = allPosts.filter(post =>
                    post.categoria === currentPost.categoria && post.url !== currentPost.url
                );
                if (sameCategory.length < limit) {
                    const otherPosts = allPosts.filter(post =>
                        post.categoria !== currentPost.categoria && post.url !== currentPost.url
                    );
                    return [...sameCategory, ...otherPosts].slice(0, limit);
                }
                return sameCategory.slice(0, limit);
            }

            // ========== FUNCIONES DE LIKES ==========
            function loadLikes(postId) {
                const likesKey = `likes_${postId}_${currentUser ? currentUser.id : 'anonymous'}`;
                const savedLikes = localStorage.getItem(likesKey);
                if (savedLikes) {
                    const data = JSON.parse(savedLikes);
                    likesCount = data.count;
                    isLiked = data.liked || false;
                } else {
                    likesCount = Math.floor(Math.random() * 500) + 50;
                    isLiked = false;
                }
                updateLikesUI();
            }

            function saveLikes(postId) {
                const likesKey = `likes_${postId}_${currentUser ? currentUser.id : 'anonymous'}`;
                localStorage.setItem(likesKey, JSON.stringify({
                    count: likesCount,
                    liked: isLiked
                }));
            }

            function updateLikesUI() {
                $('#likesNumber').text(likesCount.toLocaleString());
                const likeIcon = $('#likeBtn i');
                if (isLiked) {
                    likeIcon.removeClass('far').addClass('fas');
                    likeIcon.css('color', '#7B2D8E');
                } else {
                    likeIcon.removeClass('fas').addClass('far');
                    likeIcon.css('color', 'white');
                }
            }

            function toggleLike() {
                const postId = currentPost.id || currentPost.url;
                if (isLiked) {
                    likesCount--;
                    isLiked = false;
                } else {
                    likesCount++;
                    isLiked = true;
                }
                updateLikesUI();
                saveLikes(postId);
                
                $('#likeBtn').addClass('like-animation');
                setTimeout(() => $('#likeBtn').removeClass('like-animation'), 300);
            }

            // ========== FUNCIONES DE COMENTARIOS ==========
            function loadComments(postId) {
                const commentsKey = `comments_${postId}`;
                const savedComments = localStorage.getItem(commentsKey);
                return savedComments ? JSON.parse(savedComments) : [];
            }

            function saveComments(postId, comments) {
                const commentsKey = `comments_${postId}`;
                localStorage.setItem(commentsKey, JSON.stringify(comments));
            }

            function renderComments(comments) {
                const commentsList = $('#comments-list');
                const commentsCount = $('#comments-count');

                if (comments.length === 0) {
                    commentsList.html(`
                        <div class="no-comments">
                            <i class="far fa-comment-dots"></i>
                            <p>No hay comentarios aún. ¡Sé el primero en comentar!</p>
                        </div>
                    `);
                    commentsCount.text('0 comentarios');
                    return;
                }

                commentsCount.text(`${comments.length} ${comments.length === 1 ? 'comentario' : 'comentarios'}`);
                commentsList.empty();

                comments.slice().reverse().forEach(comment => {
                    const commentHtml = `
                        <div class="comment-item">
                            <div class="comment-avatar-img">
                                <div class="user-avatar" style="background-color: ${comment.avatar_color || '#7B2D8E'}; width: 36px; height: 36px; font-size: 14px;">
                                    ${comment.nombre ? comment.nombre.charAt(0).toUpperCase() : '?'}
                                </div>
                            </div>
                            <div class="comment-content-detail">
                                <div class="comment-header-detail">
                                    <strong>${escapeHtml(comment.nombre)}</strong>
                                    <span class="comment-time">${formatDate(comment.fecha)}</span>
                                </div>
                                <p>${escapeHtml(comment.texto)}</p>
                            </div>
                        </div>
                    `;
                    commentsList.append(commentHtml);
                });
            }

            function formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diff = now - date;
                const minutes = Math.floor(diff / 60000);
                const hours = Math.floor(diff / 3600000);
                const days = Math.floor(diff / 86400000);

                if (minutes < 1) return 'Justo ahora';
                if (minutes < 60) return `Hace ${minutes} min`;
                if (hours < 24) return `Hace ${hours} h`;
                if (days < 7) return `Hace ${days} d`;
                return date.toLocaleDateString();
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function addComment(commentText) {
                if (!commentText.trim()) return false;
                if (!currentUser) {
                    alert('Inicia sesión para comentar');
                    window.location.href = 'login.html';
                    return false;
                }
                
                const postId = currentPost.id || currentPost.url;
                const comments = loadComments(postId);
                const newComment = {
                    id: Date.now(),
                    nombre: currentUser.nombre || currentUser.username,
                    texto: commentText.trim(),
                    fecha: new Date().toISOString(),
                    avatar_color: currentUser.avatar_color || '#7B2D8E'
                };
                comments.push(newComment);
                saveComments(postId, comments);
                renderComments(comments);
                return true;
            }

            // ========== RENDERIZAR PINS RELACIONADOS ==========
            function renderRelatedPins(relatedPosts) {
                const container = $('#relatedPinsGrid');
                container.empty();

                if (relatedPosts.length === 0) {
                    container.html('<p class="no-related">No hay pins relacionados</p>');
                    return;
                }

                relatedPosts.forEach(post => {
                    const card = `
                        <div class="related-pin" onclick="window.location.href='detalle.html?image=${encodeURIComponent(post.url)}'">
                            <img src="${post.url}" alt="${post.titulo}">
                            <div class="related-pin-overlay">
                                <p>${escapeHtml(post.titulo)}</p>
                                <span>${post.categoria || 'Inspiración'}</span>
                            </div>
                        </div>
                    `;
                    container.append(card);
                });
            }

            // ========== FUNCIONES DE GUARDADO ==========
            function loadSavedStatus(postId) {
                const savedKey = `saved_${postId}_${currentUser ? currentUser.id : 'anonymous'}`;
                return localStorage.getItem(savedKey) === 'true';
            }

            function savePinStatus(postId, isSaved) {
                const savedKey = `saved_${postId}_${currentUser ? currentUser.id : 'anonymous'}`;
                localStorage.setItem(savedKey, isSaved);
            }

            function updateSaveButton() {
                const postId = currentPost.id || currentPost.url;
                const isSaved = loadSavedStatus(postId);
                if (isSaved) {
                    $('#savePinBtn').html('<i class="fas fa-check"></i> Guardado').css('background', '#111');
                } else {
                    $('#savePinBtn').html('<i class="fas fa-save"></i> Guardar').css('background', '#7B2D8E');
                }
            }

            // ========== FUNCIONES PRINCIPALES ==========
            function formatFollowers(count) {
                if (!count) return "0 seguidores";
                if (count >= 1000) return (count / 1000).toFixed(1) + 'k seguidores';
                return count + ' seguidores';
            }

            function showToast(message, type) {
                const toast = $('<div>').addClass('toast-message').text(message);
                toast.css({
                    position: 'fixed',
                    bottom: '20px',
                    left: '50%',
                    transform: 'translateX(-50%)',
                    background: type === 'success' ? '#2e7d32' : '#111',
                    color: 'white',
                    padding: '10px 20px',
                    borderRadius: '40px',
                    fontSize: '14px',
                    zIndex: '10000',
                    boxShadow: '0 4px 12px rgba(0,0,0,0.15)'
                });
                $('body').append(toast);
                setTimeout(() => toast.fadeOut(300, function() { $(this).remove(); }), 2000);
            }

            async function loadPage() {
                await fetchAllPosts();
                await fetchAllUsers();
                currentPost = getCurrentPost();

                if (currentPost) {
                    $("#main-image").attr("src", currentPost.url);
                    $("#modalImage").attr("src", currentPost.url);
                    $("#pin-title").text(currentPost.titulo);
                    
                    if (currentPost.descripcion) {
                        $("#pin-description").text(currentPost.descripcion).show();
                    } else {
                        $("#pin-description").hide();
                    }

                    const autorNombre = currentPost.autor_nombre || "Usuario Anónimo";
                    $("#author-name").text(autorNombre);
                    
                    const followersCount = Math.floor(Math.random() * 10000);
                    $("#author-followers").text(formatFollowers(followersCount));
                    
                    const avatarNum = autorNombre.length % 70;
                    $("#author-avatar").attr("src", `https://i.pravatar.cc/100?img=${avatarNum}`);

                    const relatedPosts = getRelatedPosts(currentPost);
                    renderRelatedPins(relatedPosts);

                    const savedComments = loadComments(currentPost.id);
                    renderComments(savedComments);
                    
                    loadLikes(currentPost.id);
                    updateFollowButton();
                    updateSaveButton();
                } else if (imageUrl) {
                    $("#main-image").attr("src", imageUrl);
                    $("#modalImage").attr("src", imageUrl);
                    $("#pin-title").text("Inspiración Creativa");
                    $("#pin-description").hide();
                    $("#author-name").text("Artista Digital");
                    $("#author-followers").text("2.3k seguidores");
                    $("#author-avatar").attr("src", "https://i.pravatar.cc/100?img=15");

                    const relatedPosts = allPosts.filter(post => post.url !== imageUrl).slice(0, 8);
                    renderRelatedPins(relatedPosts);
                    renderComments(loadComments(imageUrl));
                    currentPost = { id: imageUrl, url: imageUrl, autor_nombre: "Artista Digital", autor_id: null };
                    updateFollowButton();
                    updateSaveButton();
                }
            }

            // ========== EVENTOS ==========
            $('#likeBtn').on('click', toggleLike);
            
            $('#followBtn').on('click', function() {
                if (!currentUser) {
                    alert('Inicia sesión para seguir autores');
                    window.location.href = 'login.html';
                    return;
                }
                
                const authorId = currentPost?.autor_id;
                const authorName = currentPost?.autor_nombre || "Usuario Anónimo";
                
                if (authorId && isFollowing(authorId)) {
                    unfollowUser(authorId);
                    $('#followBtn').text('Seguir').css('background', '#7B2D8E').css('color', 'white');
                    showToast(`Dejaste de seguir a ${authorName}`, 'info');
                } else {
                    followUser({
                        id: authorId || Date.now(),
                        nombre: authorName,
                        username: authorName.toLowerCase().replace(/\s/g, ''),
                        avatar_color: '#7B2D8E'
                    });
                    $('#followBtn').text('Siguiendo').css('background', '#efefef').css('color', '#111');
                    showToast(`Ahora sigues a ${authorName}`, 'success');
                }
            });
            
            $('#savePinBtn').on('click', function() {
                if (!currentUser) {
                    alert('Inicia sesión para guardar pins');
                    window.location.href = 'login.html';
                    return;
                }
                const postId = currentPost.id || currentPost.url;
                const isCurrentlySaved = loadSavedStatus(postId);
                savePinStatus(postId, !isCurrentlySaved);
                updateSaveButton();
                showToast(isCurrentlySaved ? 'Pin eliminado de guardados' : 'Pin guardado', 'success');
            });
            
            $('#submitCommentBtn').on('click', function() {
                const commentText = $('#comment-input').val();
                if (commentText.trim()) {
                    const success = addComment(commentText);
                    if (success) {
                        $('#comment-input').val('');
                    }
                }
            });
            
            $('#comment-input').on('keypress', function(e) {
                if (e.which === 13) {
                    $('#submitCommentBtn').click();
                }
            });
            
            // Modal para ampliar imagen
            const modal = $('#imageModal');
            const expandBtn = $('#expandBtn');
            const closeBtn = $('.close-modal');
            
            expandBtn.on('click', function() {
                modal.css('display', 'flex');
            });
            
            closeBtn.on('click', function() {
                modal.css('display', 'none');
            });
            
            $(window).on('click', function(e) {
                if ($(e.target).is(modal)) {
                    modal.css('display', 'none');
                }
            });

            // ========== INICIALIZAR ==========
            updateUserUI();
            verifyToken();
            loadPage();
        });
    </script>

</body>

</html>
