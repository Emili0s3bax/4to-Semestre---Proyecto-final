<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Pin | Pinterest-UIDE</title>
    <link rel="stylesheet" href="index.css"> </head>
<body class="detail-page">
    <div class="modal-content">
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="modal-body">
            <img id="main-image" src="" alt="Detalle">
            <div class="modal-info">
                <h2>Título del Pin</h2>
                <p>34 comentarios</p>
                </div>
        </div>
    </div>
</body>

<script>
    // Obtener la URL de la imagen desde los parámetros de la página
    const urlParams = new URLSearchParams(window.location.search);
    const imageUrl = urlParams.get('image');

    // Asignar la imagen al elemento en la página de detalle
    if (imageUrl) {
        document.getElementById('main-image').src = imageUrl;
    }
</script>
</html>
